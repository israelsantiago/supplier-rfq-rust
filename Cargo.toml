[package]
name = "supplier-rfq-rpu-rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Supplier RFQ reference implementation using Domain Capabilities, RPU, Event Sourcing, FACTSTR and CCC"
license = "MIT OR Apache-2.0"

[features]
default = []
test-support = []

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
factstr = "0.5.2"
factstr-postgres = "0.5.2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
time = "0.3"
proptest = "=1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[test]]
name = "acceptance_atomic_sourcing"
path = "tests/acceptance_atomic_sourcing.rs"
required-features = ["test-support"]
