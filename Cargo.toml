[package]
name = "supplier-rfq-rpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reference implementation of Domain Capabilities, RPU and CCC for supplier RFQs"
license = "MIT"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
