services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplier_rfq
      POSTGRES_USER: rfq_user
      POSTGRES_PASSWORD: rfq_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq_user -d supplier_rfq"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - supplier-rfq-data:/var/lib/postgresql/data
volumes:
  supplier-rfq-data:
