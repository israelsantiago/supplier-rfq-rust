name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Segunda-feira, às 03:00 no horário de Brasília (UTC-3).
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install structural-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Validate RPU boundaries and Rust tests
        run: bash scripts/verify-rpu-boundaries.sh

  functional-core-branch-coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Require 100% Functional Core branch coverage
        run: bash scripts/coverage-functional-core.sh

  openapi-contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint OpenAPI contract
        run: bash scripts/verify-openapi.sh

  mermaid-diagrams:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate all Mermaid diagrams embedded in Markdown
        run: sh scripts/verify-mermaid-diagrams.sh

  documentation-current-state:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify README, ADR index and active branch policy
        run: bash scripts/verify-documentation-current-state.sh

  mutation-testing:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run targeted Functional Core mutation tests
        run: bash scripts/mutate-functional-core.sh
