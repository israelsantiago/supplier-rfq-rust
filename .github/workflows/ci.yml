name: Rust CI

on:
  push:
    branches: [main, event-sourcing-factstr]
  pull_request:
    branches: [main, event-sourcing-factstr]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate RPU boundaries and Rust tests
        run: bash scripts/verify-rpu-boundaries.sh
