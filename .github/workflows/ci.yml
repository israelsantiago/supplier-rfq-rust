name: Rust CI

on:
  push:
    branches: [main, event-sourcing-factstr]
  pull_request:
    branches: [main, event-sourcing-factstr]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate RPU boundaries and Rust tests
        run: bash scripts/verify-rpu-boundaries.sh

  functional-core-branch-coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Require 100% Functional Core branch coverage
        run: bash scripts/coverage-functional-core.sh

  openapi-contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint OpenAPI contract
        run: bash scripts/verify-openapi.sh

  mermaid-diagrams:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate all Mermaid diagrams embedded in Markdown
        run: sh scripts/verify-mermaid-diagrams.sh
