openapi: 3.1.0
info:
  title: Supplier RFQ API — FACTSTR
  version: 0.2.0
  description: API REST de referência para Domain Capabilities, RPU, Event Sourcing e CCC com FACTSTR.
servers:
  - url: http://127.0.0.1:3000
security: []
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API está ativa e configurada para FACTSTR/PostgreSQL.
  /api/rfqs:
    post:
      summary: OpenRfq — abre RFQ e registra os itens num fato imutável
      operationId: openRfq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenRfqRequest'
      responses:
        '201':
          description: RFQ aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqOpenedFact'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/suppliers:
    post:
      summary: RegisterSupplier — registra a identidade imutável do fornecedor
      operationId: registerSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSupplierRequest'
      responses:
        '201':
          description: Fato de registro do fornecedor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRegisteredFact'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/suppliers/{supplier_id}/eligibility:
    put:
      summary: SetSupplierEligibility — registra uma alteração de elegibilidade
      operationId: setSupplierEligibility
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSupplierEligibilityRequest'
      responses:
        '200':
          description: Fato de elegibilidade registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierEligibilityChangedFact'
        '404':
          description: Fornecedor ainda não foi registrado.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/rfqs/summaries:
    get:
      summary: ListRfqSummaries — consulta a projeção paginada de RFQs
      operationId: listRfqSummaries
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de resumos materializados; a projeção é eventualmente consistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqSummaryPage'
        '400':
          description: Filtro, limit ou offset inválido.
  /api/rfqs/{rfq_id}/summary:
    get:
      summary: GetRfqSummary — consulta o resumo materializado de uma RFQ
      operationId: getRfqSummary
      parameters:
        - $ref: '#/components/parameters/RfqId'
      responses:
        '200':
          description: Resumo da RFQ derivado do log de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqSummary'
        '404':
          description: Resumo ainda não materializado ou RFQ inexistente; a projeção é eventualmente consistente.
  /api/rfqs/{rfq_id}/quotes:
    post:
      summary: SubmitSupplierQuote — valida e registra a cotação com append_if
      operationId: submitSupplierQuote
      parameters:
        - $ref: '#/components/parameters/RfqId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSupplierQuoteRequest'
      responses:
        '201':
          description: Cotação registrada como fato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierQuoteSubmittedFact'
        '404':
          description: RFQ ou fornecedor não encontrado
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      summary: ListSupplierQuotes — materializa a consulta a partir dos fatos
      operationId: listSupplierQuotes
      parameters:
        - $ref: '#/components/parameters/RfqId'
      responses:
        '200':
          description: Cotações da RFQ
          content:
            application/json:
              schema:
                type: object
                required: [quotes]
                properties:
                  quotes:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/SupplierQuoteSubmittedFact'
                        - type: object
                          required: [sequence_number]
                          properties:
                            sequence_number:
                              type: integer
                              format: int64
        '404':
          description: RFQ não encontrada
  /api/rfqs/{rfq_id}/close:
    post:
      summary: CloseRfq — registra o fechamento por append condicional
      operationId: closeRfq
      parameters:
        - $ref: '#/components/parameters/RfqId'
      responses:
        '200':
          description: RFQ fechada
        '404':
          description: RFQ não encontrada
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    RfqId:
      name: rfq_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Conflict:
      description: Conflito de negócio ou Command Context Consistency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Entrada sintaticamente válida, mas inválida para a regra de negócio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RfqSummary:
      type: object
      required: [rfq_id, reference, currency, status, opened_at, item_count, quote_count, last_event_sequence, projected_at]
      properties:
        rfq_id:
          type: string
          format: uuid
        reference:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [open, closed]
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        item_count:
          type: integer
        quote_count:
          type: integer
          format: int64
        lowest_quote_amount_cents:
          type: [integer, 'null']
          format: int64
          description: Menor total cotado, em centavos da moeda da RFQ.
        lowest_quote_supplier_id:
          type: [string, 'null']
          format: uuid
        last_event_sequence:
          type: integer
          format: int64
        projected_at:
          type: string
          format: date-time
    RfqSummaryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RfqSummary'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    RfqItem:
      type: object
      additionalProperties: false
      required: [id, sku, description, required_quantity]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        required_quantity:
          type: integer
          format: int64
          minimum: 1
    OpenRfqRequest:
      type: object
      additionalProperties: false
      required: [reference, currency, items]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RfqItem'
    RfqOpenedFact:
      type: object
      additionalProperties: false
      required: [rfq_id, reference, currency, opened_at, items]
      properties:
        rfq_id:
          type: string
          format: uuid
        reference:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        opened_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RfqItem'
    RegisterSupplierRequest:
      type: object
      additionalProperties: false
      required: [reference, name]
      properties:
        id:
          type: string
          format: uuid
          description: Optional deterministic ID; generated by the service when omitted.
        reference:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    SupplierRegisteredFact:
      type: object
      additionalProperties: false
      required: [supplier_id, reference, name, registered_at]
      properties:
        supplier_id:
          type: string
          format: uuid
        reference:
          type: string
        name:
          type: string
        registered_at:
          type: string
          format: date-time
    SetSupplierEligibilityRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [eligible, blocked]
    SupplierEligibilityChangedFact:
      type: object
      additionalProperties: false
      required: [supplier_id, status, changed_at]
      properties:
        supplier_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [eligible, blocked]
        changed_at:
          type: string
          format: date-time
    QuotedItemInput:
      type: object
      additionalProperties: false
      required: [rfq_item_id, quantity, unit_price_cents]
      properties:
        rfq_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
          minimum: 1
        unit_price_cents:
          type: integer
          format: int64
          minimum: 1
    SubmitSupplierQuoteRequest:
      type: object
      additionalProperties: false
      required: [supplier_id, currency, delivery_days, valid_until, items]
      properties:
        supplier_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        delivery_days:
          type: integer
          minimum: 1
        valid_until:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotedItemInput'
    QuotedItemFact:
      type: object
      additionalProperties: false
      required: [rfq_item_id, quantity, unit_price_cents, line_total_cents]
      properties:
        rfq_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
          minimum: 1
        unit_price_cents:
          type: integer
          format: int64
          minimum: 1
        line_total_cents:
          type: integer
          format: int64
    SupplierQuoteSubmittedFact:
      type: object
      additionalProperties: false
      required: [quote_id, rfq_id, supplier_id, currency, total_amount_cents, delivery_days, valid_until, submitted_at, items]
      properties:
        quote_id:
          type: string
          format: uuid
        rfq_id:
          type: string
          format: uuid
        supplier_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        total_amount_cents:
          type: integer
          format: int64
        delivery_days:
          type: integer
          minimum: 1
        valid_until:
          type: string
          format: date
        submitted_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotedItemFact'
