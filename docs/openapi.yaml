openapi: 3.1.0
info:
  title: Supplier RFQ Domain Capabilities API
  version: 0.1.0
  description: REST API reference for SubmitSupplierQuote, CloseRfq, and ListSupplierQuotes capabilities.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is responding
  /api/rfqs/{rfq_id}/quotes:
    parameters:
      - $ref: '#/components/parameters/RfqId'
    post:
      summary: Submit a supplier quote (SubmitSupplierQuote command capability)
      operationId: submitSupplierQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSupplierQuote'
            example:
              supplier_id: 22222222-2222-4222-8222-222222222222
              currency: BRL
              delivery_days: 7
              valid_until: '2099-12-31'
              items:
                - rfq_item_id: 44444444-4444-4444-8444-444444444441
                  quantity: 10
                  unit_price_cents: 1250
                - rfq_item_id: 44444444-4444-4444-8444-444444444442
                  quantity: 5
                  unit_price_cents: 3000
      responses:
        '201':
          description: Quote submitted and committed
        '404':
          description: RFQ or supplier not found
        '409':
          description: Business rejection (closed RFQ, blocked supplier, duplicate quote)
        '422':
          description: The quote violates the requested item, quantity, currency, or numeric rules
        '500':
          description: Unexpected infrastructure failure
    get:
      summary: List supplier quotes (query capability; read-only)
      operationId: listSupplierQuotes
      responses:
        '200':
          description: Quotes for the RFQ
        '404':
          description: RFQ not found
  /api/rfqs/{rfq_id}/close:
    parameters:
      - $ref: '#/components/parameters/RfqId'
    post:
      summary: Close an open RFQ (CloseRfq command capability)
      operationId: closeRfq
      responses:
        '200':
          description: RFQ closed and transaction committed
        '404':
          description: RFQ not found
        '409':
          description: RFQ is not open or has already been closed
components:
  parameters:
    RfqId:
      name: rfq_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SubmitSupplierQuote:
      type: object
      additionalProperties: false
      required: [supplier_id, currency, delivery_days, valid_until, items]
      properties:
        supplier_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        delivery_days:
          type: integer
          minimum: 1
        valid_until:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [rfq_item_id, quantity, unit_price_cents]
            properties:
              rfq_item_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
              unit_price_cents:
                type: integer
                minimum: 1
